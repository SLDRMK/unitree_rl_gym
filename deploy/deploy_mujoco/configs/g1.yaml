# 
# policy_path: "{LEGGED_GYM_ROOT_DIR}/deploy/pre_train/g1/motion.pt"
policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/g1/Apr13_07-17-29_/policy_lstm_1.pt"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/g1_description/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0, 
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
clip_actions: 100.0
clip_torques: true
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47
joint_names: [
  left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
  left_knee_joint, left_ankle_pitch_joint, left_ankle_roll_joint,
  right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
  right_knee_joint, right_ankle_pitch_joint, right_ankle_roll_joint
]

cmd_init: [0.5, 0.0, 0.0]